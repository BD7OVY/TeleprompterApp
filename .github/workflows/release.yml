name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名 (如 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: '版本号 (整数, 每次发布 +1)'
        required: true
        default: '1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "${{ github.workspace }}/release.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            echo "code=$(echo "$TAG" | tr -cd '0-9')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Rename APK to ASCII name (avoid non-ASCII path issues)
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/teleprompter.apk"
          ls -l app/build/outputs/apk/release/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Teleprompter ${{ steps.ver.outputs.name }}
          files: |
            path: app/build/outputs/apk/release/teleprompter.apk
            name: 提词器.apk
          generate_release_notes: true
